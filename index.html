<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金海科产品技术交流 — 任务追踪</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#F7F6F3;--surface:#FFFFFF;--border:#E8E6E0;--border2:#D4D0C8;
    --text:#1A1A18;--text2:#6B6860;--text3:#A8A49C;
    --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#085041;
    --amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#633806;
    --red:#A32D2D;--red-bg:#FCEBEB;--red-text:#791F1F;
    --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
    --radius:10px;--radius-sm:6px;
  }
  body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem;}
  .container{max-width:860px;margin:0 auto;}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:12px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:36px;height:36px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .logo-icon svg{width:20px;height:20px;fill:white;}
  h1{font-size:18px;font-weight:700;color:var(--text);}
  .subtitle{font-size:13px;color:var(--text3);margin-top:2px;}
  .report-btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:white;cursor:pointer;font-size:13px;color:var(--text2);font-family:'Noto Sans SC',sans-serif;}
  .report-btn:hover{background:var(--bg);color:var(--text);}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem;}
  .stat{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;}
  .stat-num{font-size:24px;font-weight:700;}
  .stat-label{font-size:11px;color:var(--text3);margin-top:3px;}

  .card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
  .card-title{font-size:12px;font-weight:500;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:0.5px;}

  .form-row{display:grid;grid-template-columns:1fr 120px 120px 90px;gap:8px;margin-bottom:8px;}
  .form-row2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;}
  .fg{display:flex;flex-direction:column;gap:4px;}
  .fg label{font-size:11px;color:var(--text3);}
  input[type=text],input[type=date],select,textarea{
    font-family:'Noto Sans SC',sans-serif;font-size:13px;
    border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:7px 10px;background:white;color:var(--text);outline:none;width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--green);}
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .add-btn{background:var(--text);color:white;border:none;padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:'Noto Sans SC',sans-serif;white-space:nowrap;align-self:flex-end;}
  .add-btn:hover{opacity:0.85;}

  .filters{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
  .fb{padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:white;color:var(--text2);font-family:'Noto Sans SC',sans-serif;}
  .fb.active{background:var(--text);color:white;border-color:var(--text);}

  .task-list{display:flex;flex-direction:column;gap:8px;}
  .tc{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:start;transition:border-color 0.15s;}
  .tc:hover{border-color:var(--border2);}
  .tc.done{opacity:0.45;}
  .tc.p-high{border-left:3px solid #E24B4A;}
  .tc.p-med{border-left:3px solid #EF9F27;}
  .tc.p-low{border-left:3px solid #97C459;}
  .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.15s;}
  .chk.on{background:var(--green);border-color:var(--green);}
  .chk.on::after{content:'✓';color:white;font-size:13px;}
  .ttitle{font-size:14px;color:var(--text);margin-bottom:6px;line-height:1.45;}
  .tc.done .ttitle{text-decoration:line-through;color:var(--text3);}
  .tmeta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;}
  .b-todo{background:var(--blue-bg);color:var(--blue-text);}
  .b-progress{background:var(--amber-bg);color:var(--amber-text);}
  .b-done{background:var(--green-bg);color:var(--green-text);}
  .b-blocked{background:var(--red-bg);color:var(--red-text);}
  .meta-item{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:3px;}
  .meta-item.overdue{color:var(--red);}
  .tact{display:flex;gap:4px;align-items:center;flex-shrink:0;}
  .tact select{font-size:12px;padding:4px 6px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;width:auto;}
  .del-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:4px;font-size:16px;line-height:1;}
  .del-btn:hover{color:var(--red);background:var(--red-bg);}
  .empty{text-align:center;padding:3rem;color:var(--text3);font-size:14px;}

  .report-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-top:1rem;font-size:13px;line-height:1.8;white-space:pre-wrap;display:none;}
  .copy-btn{margin-top:10px;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:white;cursor:pointer;font-size:12px;font-family:'Noto Sans SC',sans-serif;color:var(--text2);}
  .copy-btn:hover{background:var(--bg);}

  .save-notice{font-size:11px;color:var(--text3);margin-left:8px;}

  @media(max-width:600px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .form-row{grid-template-columns:1fr 1fr;}
    .form-row2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </div>
      <div>
        <h1>金海科产品技术交流</h1>
        <div class="subtitle">任务追踪板 <span class="save-notice" id="save-notice"></span></div>
      </div>
    </div>
    <button class="report-btn" onclick="generateReport()">生成今日报告</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="card-title">＋ 添加任务</div>
    <div class="form-row">
      <div class="fg"><label>任务描述</label><input type="text" id="t-title" placeholder="输入任务内容…" /></div>
      <div class="fg"><label>负责人</label>
        <select id="t-assign">
          <option>陈树芳</option><option>Johnny Tai</option><option>松岐</option><option>待确认</option>
        </select>
      </div>
      <div class="fg"><label>截止日期</label><input type="date" id="t-due" /></div>
      <div class="fg"><label>优先级</label>
        <select id="t-pri"><option value="med">中</option><option value="high">高</option><option value="low">低</option></select>
      </div>
    </div>
    <div class="form-row2">
      <div class="fg"><label>备注</label><input type="text" id="t-note" placeholder="补充说明…" /></div>
      <div class="fg"><label>状态</label>
        <select id="t-status"><option value="todo">待处理</option><option value="progress">进行中</option><option value="blocked">卡住了</option><option value="done">完成</option></select>
      </div>
      <button class="add-btn" onclick="addTask()">添加任务</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="task-list" id="task-list"></div>

  <div id="report-section" style="display:none;">
    <div class="card" style="margin-top:1rem;">
      <div class="card-title">今日任务跟进报告</div>
      <div class="report-box" id="report-box" style="display:block;"></div>
      <button class="copy-btn" onclick="copyReport()">复制报告</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'jinhaike_v2';
const statusLabel = {todo:'待处理',progress:'进行中',done:'完成',blocked:'卡住了'};
let tasks = [], nextId = 1, filter = 'all';

function today(){ return new Date().toISOString().split('T')[0]; }
function isOverdue(due,status){ return due && status !== 'done' && due < today(); }

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(d){ tasks=d.tasks||[]; nextId=d.nextId||1; }
  }catch(e){}
  if(!tasks.length) seed();
  render();
}

function seed(){
  [
    {title:'跟进 XA 后备箱注塑完成时间',assignee:'陈树芳',priority:'high',status:'todo'},
    {title:'确认 XA6 氛围灯本月能否完成',assignee:'陈树芳',priority:'high',status:'todo'},
    {title:'提供氛围灯视频',assignee:'陈树芳',priority:'med',status:'todo'},
    {title:'安排拍照（蓝色F4+2、G款）',assignee:'待确认',priority:'med',status:'todo'},
  ].forEach(t=>tasks.push({id:nextId++,...t,due:'',note:''}));
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks,nextId})); }catch(e){}
  const n=document.getElementById('save-notice');
  n.textContent='已保存';setTimeout(()=>n.textContent='',2000);
}

function renderStats(){
  const total=tasks.length, done=tasks.filter(t=>t.status==='done').length;
  const prog=tasks.filter(t=>t.status==='progress').length;
  const need=tasks.filter(t=>isOverdue(t.due,t.status)||t.status==='blocked').length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">全部任务</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--green)">${done}</div><div class="stat-label">已完成</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--amber)">${prog}</div><div class="stat-label">进行中</div></div>
    <div class="stat"><div class="stat-num" style="color:var(--red)">${need}</div><div class="stat-label">需关注</div></div>`;
}

function renderFilters(){
  const fs=[{k:'all',l:'全部'},{k:'todo',l:'待处理'},{k:'progress',l:'进行中'},{k:'blocked',l:'卡住了'},{k:'done',l:'完成'}];
  document.getElementById('filters').innerHTML=fs.map(f=>`<button class="fb ${filter===f.k?'active':''}" onclick="setFilter('${f.k}')">${f.l}</button>`).join('');
}

function renderTasks(){
  let v = filter==='all'?[...tasks]:tasks.filter(t=>t.status===filter);
  if(!v.length){ document.getElementById('task-list').innerHTML=`<div class="empty">没有任务 ✓</div>`; return; }
  document.getElementById('task-list').innerHTML=v.map(t=>{
    const ov=isOverdue(t.due,t.status);
    return `<div class="tc ${t.status==='done'?'done':''} p-${t.priority||'med'}">
      <div class="chk ${t.status==='done'?'on':''}" onclick="toggleDone(${t.id})"></div>
      <div>
        <div class="ttitle">${t.title}</div>
        <div class="tmeta">
          <span class="badge b-${t.status}">${statusLabel[t.status]}</span>
          ${t.assignee?`<span class="meta-item">👤 ${t.assignee}</span>`:''}
          ${t.due?`<span class="meta-item ${ov?'overdue':''}">📅 ${t.due}${ov?' · 逾期':''}</span>`:''}
          ${t.note?`<span class="meta-item">${t.note}</span>`:''}
        </div>
      </div>
      <div class="tact">
        <select onchange="updateStatus(${t.id},this.value)">
          ${Object.entries(statusLabel).map(([k,l])=>`<option value="${k}" ${t.status===k?'selected':''}>${l}</option>`).join('')}
        </select>
        <button class="del-btn" onclick="delTask(${t.id})">×</button>
      </div>
    </div>`;
  }).join('');
}

function render(){ renderStats(); renderFilters(); renderTasks(); }
function setFilter(f){ filter=f; render(); }
function toggleDone(id){ const t=tasks.find(t=>t.id===id); if(t){t.status=t.status==='done'?'todo':'done'; render(); save();} }
function updateStatus(id,s){ const t=tasks.find(t=>t.id===id); if(t){t.status=s; render(); save();} }
function delTask(id){ if(confirm('确认删除这个任务？')){ tasks=tasks.filter(t=>t.id!==id); render(); save(); } }

function addTask(){
  const title=document.getElementById('t-title').value.trim();
  if(!title){ document.getElementById('t-title').focus(); return; }
  tasks.unshift({
    id:nextId++, title,
    assignee:document.getElementById('t-assign').value,
    due:document.getElementById('t-due').value,
    priority:document.getElementById('t-pri').value,
    status:document.getElementById('t-status').value,
    note:document.getElementById('t-note').value.trim()
  });
  document.getElementById('t-title').value='';
  document.getElementById('t-note').value='';
  render(); save();
}

function generateReport(){
  const d = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
  const todo=tasks.filter(t=>t.status==='todo');
  const prog=tasks.filter(t=>t.status==='progress');
  const done=tasks.filter(t=>t.status==='done');
  const blocked=tasks.filter(t=>t.status==='blocked');
  const overdue=tasks.filter(t=>isOverdue(t.due,t.status));

  let r = `金海科产品技术交流 — 任务跟进报告\n${d}\n`;
  r += `${'─'.repeat(30)}\n`;
  if(prog.length){ r+=`\n【进行中】${prog.length}项\n`; prog.forEach(t=>{ r+=`• ${t.title}${t.assignee?' — '+t.assignee:''}\n`; }); }
  if(todo.length){ r+=`\n【待处理】${todo.length}项\n`; todo.forEach(t=>{ r+=`• ${t.title}${t.assignee?' — '+t.assignee:''}${t.priority==='high'?' ⚠️':''}\n`; }); }
  if(blocked.length){ r+=`\n【卡住了】${blocked.length}项\n`; blocked.forEach(t=>{ r+=`• ${t.title}${t.assignee?' — '+t.assignee:''}\n`; }); }
  if(done.length){ r+=`\n【已完成】${done.length}项\n`; done.forEach(t=>{ r+=`✓ ${t.title}\n`; }); }
  if(overdue.length){ r+=`\n⚠️ 逾期未完成：${overdue.length}项，请跟进\n`; }
  r += `\n${'─'.repeat(30)}\n合计：${tasks.length}项任务，完成率 ${tasks.length?Math.round(done.length/tasks.length*100):0}%`;

  document.getElementById('report-box').textContent=r;
  document.getElementById('report-section').style.display='block';
  document.getElementById('report-section').scrollIntoView({behavior:'smooth'});
}

function copyReport(){
  const text=document.getElementById('report-box').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector('.copy-btn');
    btn.textContent='已复制！';setTimeout(()=>btn.textContent='复制报告',2000);
  });
}

document.getElementById('t-title').addEventListener('keydown',e=>{ if(e.key==='Enter') addTask(); });
load();
</script>
</body>
</html>
