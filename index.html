<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金海科产品技术交流 — 任务报告</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans SC',sans-serif;background:#F7F6F3;color:#1A1A18;min-height:100vh;padding:2rem 1rem;}
  .container{max-width:720px;margin:0 auto;}
  header{margin-bottom:2rem;}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-dot{width:10px;height:10px;border-radius:50%;background:#1D9E75;}
  h1{font-size:18px;font-weight:700;}
  .updated{font-size:12px;color:#A8A49C;}
  .date-badge{font-size:13px;color:#6B6860;background:white;border:1px solid #E8E6E0;padding:5px 12px;border-radius:20px;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:2rem;}
  .stat{background:white;border:1px solid #E8E6E0;border-radius:10px;padding:14px;text-align:center;}
  .stat-num{font-size:26px;font-weight:700;}
  .stat-label{font-size:11px;color:#A8A49C;margin-top:3px;}
  .section{margin-bottom:1.5rem;}
  .section-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .section-label{font-size:13px;font-weight:500;color:#6B6860;}
  .section-count{font-size:12px;color:#A8A49C;background:#F7F6F3;padding:2px 8px;border-radius:10px;}
  .task-card{background:white;border:1px solid #E8E6E0;border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:start;gap:12px;}
  .task-card.p-high{border-left:3px solid #E24B4A;}
  .task-card.p-med{border-left:3px solid #EF9F27;}
  .task-card.p-low{border-left:3px solid #97C459;}
  .task-card.done-card{opacity:0.45;}
  .status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px;}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:14px;color:#1A1A18;margin-bottom:5px;line-height:1.45;}
  .done-card .task-title{text-decoration:line-through;color:#A8A49C;}
  .task-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .meta{font-size:11px;color:#A8A49C;display:flex;align-items:center;gap:3px;}
  .meta.overdue{color:#A32D2D;font-weight:500;}
  .badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;}
  .b-todo{background:#E6F1FB;color:#0C447C;}
  .b-progress{background:#FAEEDA;color:#633806;}
  .b-done{background:#E1F5EE;color:#085041;}
  .b-blocked{background:#FCEBEB;color:#791F1F;}
  .empty{text-align:center;padding:1.5rem;color:#A8A49C;font-size:13px;background:white;border:1px solid #E8E6E0;border-radius:10px;}
  .progress-bar{background:#E8E6E0;border-radius:10px;height:6px;margin-bottom:2rem;overflow:hidden;}
  .progress-fill{height:100%;background:#1D9E75;border-radius:10px;}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:#A8A49C;margin-bottom:6px;}
  footer{margin-top:2rem;text-align:center;font-size:12px;color:#A8A49C;padding-top:1rem;border-top:1px solid #E8E6E0;}
  @media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <div class="logo">
        <div class="logo-dot"></div>
        <h1>金海科产品技术交流</h1>
      </div>
      <div class="date-badge" id="date-badge"></div>
    </div>
    <div class="updated">更新时间：2026年5月10日</div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="progress-label">
    <span>任务完成进度</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <div id="sections"></div>

  <footer>此报告由 Claude AI 自动生成 · 如有更新请联系 Janice</footer>
</div>

<script>
const tasks = [
  {title:'负责采购，五月底前拿出降 $500 的方案', assignee:'慶澤', due:'2026-05-31', priority:'high', status:'todo', note:''},
  {title:'跟进 XA 后备箱注塑完成时间', assignee:'陈树芳', due:'2026-05-30', priority:'high', status:'progress', note:'在做皮纹，供应商 5月30日回复'},
  {title:'确认 XA6 氛围灯本月能否完成', assignee:'陈树芳', due:'', priority:'high', status:'todo', note:''},
  {title:'提供氛围灯视频', assignee:'陈树芳', due:'', priority:'med', status:'todo', note:''},
  {title:'安排拍照（蓝色F4+2、G款）', assignee:'陈树芳', due:'', priority:'med', status:'todo', note:''},
];

const statusLabel = {todo:'待处理', progress:'进行中', done:'完成', blocked:'卡住了'};
const statusColor = {todo:'#378ADD', progress:'#EF9F27', done:'#1D9E75', blocked:'#E24B4A'};

function today(){ return new Date().toISOString().split('T')[0]; }
function isOverdue(due, status){ return due && status !== 'done' && due < today(); }

function init(){
  const now = new Date();
  document.getElementById('date-badge').textContent = now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

  const total = tasks.length;
  const done = tasks.filter(t=>t.status==='done').length;
  const prog = tasks.filter(t=>t.status==='progress').length;
  const need = tasks.filter(t=>isOverdue(t.due,t.status)||t.status==='blocked').length;
  const pct = total ? Math.round(done/total*100) : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">全部任务</div></div>
    <div class="stat"><div class="stat-num" style="color:#1D9E75">${done}</div><div class="stat-label">已完成</div></div>
    <div class="stat"><div class="stat-num" style="color:#EF9F27">${prog}</div><div class="stat-label">进行中</div></div>
    <div class="stat"><div class="stat-num" style="color:#E24B4A">${need}</div><div class="stat-label">需关注</div></div>`;

  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  const groups = [
    {key:'blocked', label:'卡住了 — 需要跟进', color:'#E24B4A'},
    {key:'progress', label:'进行中', color:'#EF9F27'},
    {key:'todo', label:'待处理', color:'#378ADD'},
    {key:'done', label:'已完成', color:'#1D9E75'},
  ];

  let html = '';
  groups.forEach(g => {
    const list = tasks.filter(t=>t.status===g.key);
    html += `<div class="section">
      <div class="section-header">
        <div class="section-dot" style="background:${g.color}"></div>
        <span class="section-label">${g.label}</span>
        <span class="section-count">${list.length}</span>
      </div>`;
    if(!list.length){
      html += `<div class="empty">暂无${statusLabel[g.key]}任务</div>`;
    } else {
      list.forEach(t => {
        const ov = isOverdue(t.due, t.status);
        html += `<div class="task-card p-${t.priority} ${t.status==='done'?'done-card':''}">
          <div class="status-dot" style="background:${statusColor[t.status]};margin-top:4px;"></div>
          <div class="task-body">
            <div class="task-title">${t.title}</div>
            <div class="task-meta">
              <span class="badge b-${t.status}">${statusLabel[t.status]}</span>
              ${t.assignee?`<span class="meta">👤 ${t.assignee}</span>`:''}
              ${t.due?`<span class="meta ${ov?'overdue':''}">📅 ${t.due}${ov?' · 逾期':''}</span>`:''}
              ${t.priority==='high'?`<span class="meta" style="color:#A32D2D;">⚠️ 高优先级</span>`:''}
              ${t.note?`<span class="meta">${t.note}</span>`:''}
            </div>
          </div>
        </div>`;
      });
    }
    html += `</div>`;
  });
  document.getElementById('sections').innerHTML = html;
}

init();
</script>
</body>
</html>
